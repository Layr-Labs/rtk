name: Sync upstream

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:      # allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Merge upstream/master
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      new_tag: ${{ steps.version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/rtk-ai/rtk.git

      - name: Fetch upstream
        run: git fetch upstream master

      - name: Capture version before merge
        id: before
        run: echo "version=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Merge upstream/master
        id: merge
        run: |
          if git merge --no-edit upstream/master; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Push if merged cleanly
        if: steps.merge.outputs.merged == 'true'
        run: git push origin master

      - name: Tag new version if bumped
        id: version
        if: steps.merge.outputs.merged == 'true'
        run: |
          VERSION_AFTER=$(grep '^version = ' Cargo.toml | head -1 | cut -d'"' -f2)
          VERSION_BEFORE="${{ steps.before.outputs.version }}"
          if [ "$VERSION_AFTER" != "$VERSION_BEFORE" ]; then
            TAG="v${VERSION_AFTER}"
            if ! git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
              git tag "$TAG"
              git push origin "$TAG"
              echo "new_tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "Tagging new version: $TAG"
            fi
          fi

      - name: Open issue on conflict
        if: steps.merge.outputs.merged == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Upstream sync conflict — manual merge required';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'upstream-sync',
            });
            if (issues.some(i => i.title === title)) return; // already open
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title,
              labels: ['upstream-sync'],
              body: [
                '`sync-upstream` workflow failed to auto-merge.',
                '',
                'Run locally to resolve:',
                '```',
                'git fetch upstream',
                'git merge upstream/master',
                '# fix conflicts',
                'git push',
                '```',
                '',
                `Triggered by run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });

  release:
    name: Build and publish release
    needs: sync
    if: needs.sync.outputs.new_tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.sync.outputs.new_tag }}
      prerelease: false
    permissions:
      contents: write
    secrets: inherit
